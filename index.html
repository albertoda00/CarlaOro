<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<title>CarlaOro</title>
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-title" content="Carla Oro">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#fbf6ee">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* VOICE: elegante e pratica, da banco di gioielleria
   IDEA: come l'app CarlaOro del video: blocchi con fascia marrone e titolo oro, fondo tortora, campi bianchi
   PICTURE: il riquadro del prezzo marrone, centrato, con cifra dorata e tasto banconota
   COLOUR and TYPE: beige, tortora, marrone, oro; Cormorant Garamond per i titoli, Inter per testi e numeri
   LAYOUT: telefono a colonna con barra in basso; iPad con menu fisso a sinistra e due colonne */
:root{color-scheme:light dark;
--bg:light-dark(#fbf6ee,#1f1914);--panel:light-dark(#e8dac5,#2f261e);--surf:light-dark(#fffcf7,#2a221b);--field:light-dark(#fffcf7,#1f1914);
--ink:light-dark(#3f2d21,#f1e6d5);--mut:light-dark(#8d7a67,#a99985);--line:light-dark(#dfd2bf,#3d3228);--fbord:light-dark(#98897f,#6a5a4b);
--band:#503629;--bandt:#dcb45c;--gold:light-dark(#a8822f,#d6b05a);--goldbtn:#c9a54f;--chipbg:light-dark(#dfcfae,#4a3b20);
--yel:#e6bf3a;--red:#c0392b;--alarm:#d11f1f;--ok:#4b7a4b;--okbg:light-dark(#dfe8d6,#2e3b2a);--kb:0px;
--sh:none;
--serif:'Cormorant Garamond',Georgia,serif;--sans:Inter,system-ui,-apple-system,sans-serif}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 var(--sans);overflow:hidden;font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased}
#app{position:relative;max-width:520px;height:100vh;height:100dvh;margin:0 auto;background:var(--bg);display:flex;flex-direction:column;overflow:hidden}
header{flex:none;position:sticky;top:-16px;margin:-16px -16px 16px;display:grid;grid-template-columns:46px 1fr 46px;align-items:center;padding:calc(env(safe-area-inset-top) + 8px) 14px 10px;background:var(--bg);border-bottom:1px solid var(--line);z-index:5}
.wm{font:500 19px var(--serif);letter-spacing:.34em;text-align:center;color:var(--ink);padding-left:.32em}.wm b{color:var(--gold);font-weight:600}
.circ{width:44px;height:44px;border:1px solid var(--line);background:var(--surf);color:var(--ink);border-radius:50%;display:grid;place-items:center;cursor:pointer;padding:0}
main{flex:1;overflow-y:auto;padding:16px 16px calc(28px + var(--kb));-webkit-overflow-scrolling:touch;scroll-padding:80px}
.wrap{max-width:1000px;margin:0 auto}
h1{font:500 32px/1.1 var(--serif);margin:4px 2px 4px;color:var(--ink)}
.sub{color:var(--mut);margin:0 2px 16px;font-size:14px}
button{font-family:var(--sans)}
button:focus-visible,input:focus-visible,select:focus-visible,[role=button]:focus-visible{outline:2px solid var(--goldbtn);outline-offset:2px}
.blk{background:var(--panel);border:1px solid var(--line);border-radius:14px;margin-bottom:22px;overflow:hidden;box-shadow:var(--sh)}
.bh{background:var(--band);color:var(--bandt);font:500 22px/1.15 var(--serif);letter-spacing:.01em;padding:12px 16px;display:flex;align-items:center;justify-content:space-between;gap:10px}
.bb{padding:16px 16px 18px}
.row{display:flex;align-items:center;gap:12px}.sp{flex:1}
.mut{color:var(--mut)}.small{font-size:13px;color:var(--mut)}
.num{white-space:nowrap}
.seg{display:flex;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:6px;gap:4px;margin-bottom:18px}
.seg button{flex:1;min-height:52px;border:0;border-radius:11px;background:none;color:var(--ink);font-weight:600;font-size:16.5px;cursor:pointer;transition:background .15s}
.seg button.on{background:var(--band);color:var(--bandt);box-shadow:0 2px 6px rgba(45,30,20,.25)}
.seg.serif button{font:500 23px var(--serif)}
label.f{display:block;margin-bottom:14px}label.f span{display:block;font-size:13.5px;font-weight:600;color:var(--mut);margin:0 0 7px 2px}
input,select{width:100%;min-height:48px;font:400 17px var(--sans);color:var(--ink);background:var(--field);border:1px solid var(--fbord);border-radius:10px;padding:10px 14px;font-variant-numeric:tabular-nums;-webkit-appearance:none;appearance:none}
input:focus,select:focus{outline:none;border-color:var(--goldbtn);box-shadow:0 0 0 3px rgba(201,165,79,.25)}input::placeholder{color:var(--mut);opacity:.75}
input.err{border-color:var(--red)}
.g2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:0 12px}
.btn{min-height:52px;border:0;border-radius:999px;background:var(--goldbtn);color:#2b1d12;font-weight:600;font-size:16px;padding:0 22px;cursor:pointer;width:100%;display:inline-flex;align-items:center;justify-content:center;gap:8px;transition:transform .1s}
.btn:active{transform:scale(.98)}
.btn.out{background:none;color:var(--gold);border:1.5px solid var(--gold)}
.btn.danger{background:var(--red);color:#fff}
.btn.sm{min-height:40px;width:auto;font-size:14px;padding:0 16px}
.plus{flex:none;width:44px;height:44px;border:0;border-radius:9px;background:var(--band);color:var(--bandt);font-size:24px;line-height:1;cursor:pointer;display:grid;place-items:center;transition:transform .1s}
.plus:active{transform:scale(.92)}.plus.done{background:var(--ok);color:#fff;font-size:17px}
.kv{display:flex;justify-content:space-between;align-items:baseline;gap:10px;padding:8px 0}
.kv>span:first-child{color:var(--mut)}
.kv b{font-weight:600}.kv b.gold{color:var(--gold);font-size:19px}
.hr{border-top:1px solid var(--line);margin:8px 0}
.cimg{flex:none;border-radius:50%;object-fit:cover;cursor:zoom-in;box-shadow:0 2px 8px rgba(60,40,25,.25)}
.cimg.ph{display:grid;place-items:center;background:var(--chipbg);color:var(--gold);font:500 24px var(--serif);box-shadow:none;cursor:default}
.zoomimg{display:block;width:min(78vw,320px);height:auto;margin:0 auto;border-radius:50%;box-shadow:0 10px 30px rgba(0,0,0,.35)}
.bimg{flex:none;width:46px;height:68px;object-fit:contain;cursor:zoom-in;filter:drop-shadow(0 2px 4px rgba(60,40,25,.3))}
.zoombar{display:block;width:min(60vw,220px);height:auto;margin:0 auto;filter:drop-shadow(0 8px 18px rgba(0,0,0,.35))}
.saved{text-align:center;margin-top:8px;font-weight:600;color:var(--red)}.saved.ok{color:var(--ok)}.btn.dirty{box-shadow:0 0 0 3px rgba(201,165,79,.45)}
.suf{position:relative;display:block}.suf i{position:absolute;right:16px;top:50%;transform:translateY(-50%);font-style:normal;color:var(--mut)}.suf input{padding-right:40px}
.plus.pb{margin-left:-4px;background:none;color:var(--gold);border:1.5px solid var(--gold);font:600 20px var(--serif)}.plus.pb.on{background:var(--gold);color:#fff}
.prop{display:flex;align-items:center;gap:12px;margin-top:10px}.prop input{flex:1;width:auto}
.dots{display:flex;gap:7px;flex:none}.dots i{width:14px;height:14px;border-radius:50%;opacity:.22}.dots i.g{background:#3f9b4f}.dots i.y{background:var(--yel)}.dots i.r{background:var(--red)}
.dots[data-c=g] i.g,.dots[data-c=y] i.y,.dots[data-c=r] i.r{opacity:1;box-shadow:0 0 8px rgba(0,0,0,.3)}
.code{font:500 13px var(--sans);color:#d9c9b0;letter-spacing:.06em}

.jump{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 12px;margin:0 -2px 6px;scrollbar-width:none;}.jump::-webkit-scrollbar{display:none}
.jump button{flex:none;min-height:36px;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:var(--surf);color:var(--ink);font-size:13.5px;font-weight:600;cursor:pointer}
.jump button:active{background:var(--chipbg)}
.tbar{height:3px;border-radius:2px;background:rgba(224,187,98,.25);margin:8px auto 0;max-width:140px;overflow:hidden}.tbar i{display:block;height:100%;width:100%;background:#e0bb62;transform-origin:left;animation:tb 5s linear forwards}@keyframes tb{to{transform:scaleX(0)}}
#toast{display:flex;align-items:center;gap:14px}#toast button{border:0;background:none;color:#e0bb62;font-weight:700;font-size:14px;padding:4px 2px;cursor:pointer;pointer-events:auto}
.wrap{animation:vin .22s ease-out}@keyframes vin{from{opacity:0;transform:translateY(6px)}}
.badge.bump{animation:bump .35s ease}@keyframes bump{40%{transform:scale(1.35)}}
.clear{display:flex;justify-content:flex-end;margin:-6px 0 12px}.clear button{border:0;background:none;color:var(--gold);font-weight:600;font-size:14px;padding:8px 4px;cursor:pointer;display:flex;gap:6px;align-items:center}
.hint{display:flex;gap:10px;align-items:center;background:var(--chipbg);border-radius:10px;padding:11px 14px;font-size:14.5px;margin:0 0 10px}
/* riquadro prezzo */
.pbox{margin-left:26px!important;margin-right:26px!important;text-align:center;background:linear-gradient(160deg,#503629 0%,#2c2018 100%);border:1px solid #b8913e;border-radius:16px;color:#f1e6d5;padding:16px 16px 14px;margin-bottom:18px;box-shadow:0 12px 28px rgba(44,32,24,.3)}
.pbox .k{font-size:11.5px;font-weight:600;letter-spacing:.18em;color:#c9a54f}
.pbox .t{font:500 21px/1.15 var(--serif);color:#f1e6d5;margin-top:4px}
.pbox .p{font-size:clamp(34px,10vw,42px);font-weight:700;color:#e0bb62;letter-spacing:-.01em;line-height:1.1;margin:6px auto 2px;cursor:pointer;user-select:none;border-radius:12px;display:inline-block;padding:0 8px}
.pbox .u{font-size:13.5px;color:#d9c9b0;display:flex;align-items:center;justify-content:center;gap:6px}
.pbox .hr2{border-top:1px solid rgba(224,187,98,.25);margin:10px 0}
.cash{width:56px;height:40px;border:1.5px solid rgba(241,230,213,.45);border-radius:999px;background:transparent;color:#e9dcc5;display:inline-grid;place-items:center;cursor:pointer}
.cash.on{background:#e0bb62;color:#2c2018;border-color:#e0bb62}
.sqbtn{flex:none;width:52px;height:52px;border:1px solid var(--line);border-radius:14px;background:var(--surf);color:var(--ink);display:grid;place-items:center;cursor:pointer}
.sqbtn.on{background:var(--goldbtn);border-color:var(--goldbtn);color:#2b1d12}
.bar{height:12px;border-radius:999px;margin-top:12px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;border-radius:999px}
.bar.alarm i{background:var(--alarm);animation:glow 1.1s ease-in-out infinite}
@keyframes glow{50%{box-shadow:0 0 16px 4px #ff4a3a;opacity:.75}}
/* scheda quotazione */
.qcard{background:var(--surf);border:1px solid var(--line);border-radius:14px;padding:16px 18px;margin-bottom:18px}
.qcard .ic{width:46px;height:46px;border-radius:50%;background:var(--chipbg);color:var(--gold);display:grid;place-items:center;flex:none}
.cap{font-size:11.5px;font-weight:600;letter-spacing:.12em;color:var(--mut)}
.qv{font-size:22px;font-weight:700}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:600;padding:5px 12px;border-radius:999px;background:var(--okbg);color:var(--ok);border:1px solid color-mix(in srgb,var(--ok) 35%,transparent);white-space:nowrap}
.pill i{width:7px;height:7px;border-radius:50%;background:currentColor}
.qmini{display:flex;align-items:center;gap:14px;background:var(--surf);border:1px solid var(--line);border-radius:14px;padding:10px 14px;margin-bottom:18px}
.qmini .v{font-weight:700;font-size:16px}.qmini .sepv{width:1px;align-self:stretch;background:var(--line)}
.voce{padding:12px 0;border-bottom:1px solid var(--line)}.voce:last-child{border:0;padding-bottom:0}.voce:first-child{padding-top:0}
.voce .n{font-weight:600;font-size:16px}.voce .q{color:var(--gold);font-weight:600}
.voce input{width:132px;min-height:46px}
.val{text-align:right;font-size:12.5px;color:var(--mut);line-height:1.2}.val b{display:block;color:var(--ink);font-size:15px}
.chip{display:inline-block;font-size:12.5px;font-weight:600;padding:3px 10px;border-radius:999px;white-space:nowrap;background:rgba(241,230,213,.14);color:#f1e6d5}
.pvh{background:var(--band);padding:12px 14px 12px 18px;display:flex;align-items:center;gap:10px;cursor:pointer}
.pvh .id{font-weight:700;font-size:19px;color:var(--bandt);letter-spacing:.03em}.pvh .cl{color:#f1e6d5;font-size:16px}
.pvh .cd{color:var(--bandt);font-weight:700;font-size:19px;display:flex;align-items:center;gap:5px;justify-content:flex-end}
.pvh .chev{color:var(--bandt);transition:transform .2s}.pvh .chev.up{transform:rotate(180deg)}
.xr{width:40px;height:40px;border:0;border-radius:50%;background:rgba(241,230,213,.12);color:#f1e6d5;font-size:20px;cursor:pointer;flex:none}
nav.tab{flex:none;display:grid;grid-template-columns:repeat(4,1fr);background:var(--surf);border-top:1px solid var(--line);padding:8px 6px calc(6px + env(safe-area-inset-bottom));transition:opacity .15s;z-index:5}
nav.tab.kbd{opacity:0;pointer-events:none;visibility:hidden;position:absolute;bottom:0;left:0;right:0}
nav.tab button{position:relative;border:0;background:none;color:light-dark(#a3907c,#9c8b78);font-size:12px;font-weight:500;letter-spacing:.02em;padding:2px 0;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;min-height:56px}
nav.tab .ic{width:58px;height:34px;border-radius:999px;display:grid;place-items:center;transition:background .2s,color .2s}
nav.tab button.on{color:var(--ink);font-weight:600}nav.tab button.on .ic{background:light-dark(#e6d6bb,#4a3b20);color:light-dark(#6b4d3a,#e6c36e)}nav.tab button.on .ic svg{stroke-width:1.5}
.badge{position:absolute;top:-2px;left:calc(50% + 10px);background:var(--red);color:#fff;font-size:11px;font-weight:700;min-width:19px;height:19px;border-radius:10px;display:grid;place-items:center;padding:0 5px;border:2px solid var(--surf)}
#scrim{position:absolute;inset:0;background:rgba(30,20,12,.4);opacity:0;pointer-events:none;transition:opacity .25s;z-index:20}
#side{position:absolute;top:0;bottom:0;left:0;width:82%;max-width:330px;background:var(--surf);z-index:21;transform:translateX(-102%);transition:transform .28s cubic-bezier(.2,.8,.2,1);padding:calc(env(safe-area-inset-top) + 16px) 12px 16px;display:flex;flex-direction:column;gap:4px;box-shadow:8px 0 30px rgba(0,0,0,.15);overflow-y:auto}
#app.menu #scrim{opacity:1;pointer-events:auto}#app.menu #side{transform:none}
#side .top{display:flex;align-items:center;justify-content:space-between;padding:0 4px 0 8px;margin-bottom:14px}
#side .top .wm{font-size:17px;text-align:left;padding:0}
#side .closeX{width:40px;height:40px;border:0;background:none;color:var(--ink);font-size:24px;cursor:pointer}
.prof{display:flex;align-items:center;gap:12px;background:var(--panel);border-radius:14px;padding:12px;margin-bottom:12px}
.av{width:44px;height:44px;border-radius:50%;background:var(--band);color:var(--bandt);display:grid;place-items:center;font:600 17px var(--serif);flex:none}
.prof .r{font-size:13px;color:var(--gold);font-weight:600}
.mi{display:flex;align-items:center;gap:12px;text-align:left;border:1px solid transparent;background:none;color:var(--ink);padding:9px 10px;border-radius:14px;min-height:56px;cursor:pointer;width:100%}
.mi .ib{width:36px;height:36px;border-radius:10px;background:light-dark(#efe4d3,#352b22);color:light-dark(#bb9545,#d9b665);display:grid;place-items:center;flex:none}
.mi .tt{font-weight:600;font-size:15px}.mi .st{font-size:12.5px;color:var(--mut)}
.mi .ch{margin-left:auto;color:var(--mut)}
.mi.on{border-color:var(--goldbtn);background:var(--panel)}
#side .sep{font-size:11.5px;font-weight:600;letter-spacing:.12em;color:var(--mut);margin:12px 0 2px 10px}
#side .wide{display:none}
.modal{position:absolute;inset:0;z-index:60;background:rgba(30,20,12,.45);display:none;place-items:center;padding:24px}
.modal.open{display:grid}.modal .blk{width:100%;max-width:380px;margin:0;animation:pop .18s ease-out}
@keyframes pop{from{opacity:0;transform:scale(.96)}}
#toast{position:absolute;left:50%;bottom:calc(92px + env(safe-area-inset-bottom));transform:translate(-50%,16px);background:var(--band);color:#f1e6d5;padding:12px 18px;border-radius:14px;font-weight:500;font-size:14px;opacity:0;pointer-events:none;transition:.25s;z-index:65;white-space:nowrap;box-shadow:0 8px 24px rgba(0,0,0,.25)}
#toast.show{opacity:1;transform:translate(-50%,0)}
#splash,#login{position:absolute;inset:0;z-index:50;background:var(--bg);display:grid;place-items:center;padding:24px;overflow-y:auto}
.logo{width:min(240px,66vw);height:auto;display:block;margin:0 auto}
:root[data-theme=dark] .logo{filter:invert(1) hue-rotate(180deg) brightness(1.15)}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]) .logo{filter:invert(1) hue-rotate(180deg) brightness(1.15)}}
#splash .logo{animation:fade 1s ease both}@keyframes fade{from{opacity:0;transform:scale(.97)}}
#login{display:flex;flex-direction:column;background:radial-gradient(120% 70% at 50% 0%,light-dark(#fffdf8,#2a221b) 0%,var(--bg) 65%)}
#login .box{width:100%;max-width:390px;margin:auto;padding:8px 0}
#login .logo{width:min(180px,50vw);margin:0 auto 26px}
.ltabs{display:flex;gap:4px;padding:5px;border:1px solid light-dark(#d6c3a6,#4a3b2c);border-radius:14px;background:light-dark(#e8dac5,rgba(255,255,255,.03));margin-bottom:16px}
.ltabs button{flex:1;min-height:46px;border:0;border-radius:10px;background:none;color:var(--mut);font:500 20px var(--serif);letter-spacing:.04em;cursor:pointer;transition:background .2s,color .2s}
.ltabs button.on{background:#654734;color:#e6c36e;box-shadow:0 3px 10px rgba(60,40,25,.25)}
.lcard{background:light-dark(#efe4d3,#2a221b);border:1px solid light-dark(#ddcbb0,#3d3228);border-radius:18px;padding:26px 22px 22px;box-shadow:0 18px 40px -22px rgba(60,40,25,.35)}
.lt{font:500 31px/1.1 var(--serif);text-align:center;margin:0;color:var(--ink)}
.orn{display:flex;align-items:center;justify-content:center;gap:10px;margin:10px 0 8px;color:#b8913e}.orn i{display:block;width:44px;height:1px;background:currentColor;opacity:.6}
.ls{color:var(--mut);margin:0 0 22px;font-size:14px;text-align:center;line-height:1.5}
.lcard label.f span{font-size:11px;letter-spacing:.14em;text-transform:uppercase;font-weight:600;color:var(--mut)}
.lcard input{min-height:50px;border-color:light-dark(#c9b597,#5a4a3b);background:light-dark(#fffbf6,#1f1914)}
.lcard input:focus{border-color:#b8913e;box-shadow:0 0 0 3px rgba(184,145,62,.18)}
.lbtn{width:100%;min-height:52px;border:0;border-radius:12px;background:#654734;color:#ecd394;font:600 13.5px var(--sans);letter-spacing:.22em;text-transform:uppercase;cursor:pointer;margin-top:6px;transition:transform .1s,filter .15s}
.lbtn:active{transform:scale(.985)}.lbtn:hover{filter:brightness(1.08)}
.lbtn.ghost{background:none;color:var(--ink);border:1px solid light-dark(#cdb998,#5a4a3b)}
.pw{position:relative;display:block}.pw input{padding-right:52px}.eyeb{position:absolute;right:2px;top:50%;transform:translateY(-50%);width:46px;height:46px;border:0;background:none;color:var(--mut);display:grid;place-items:center;cursor:pointer}
.lerr{background:light-dark(#f8e4df,#4a2520);color:light-dark(#8a2a1e,#f3c1b8);border-radius:10px;padding:10px 12px;font-size:13.5px;margin:-2px 0 14px;display:flex;gap:8px;align-items:flex-start}
.lnk{display:block;margin:16px auto 0;border:0;background:none;color:var(--gold);font:italic 500 17px var(--serif);padding:6px;cursor:pointer}
.demo{display:flex;flex-wrap:wrap;gap:4px 14px;justify-content:center;align-items:center;margin-top:22px;font-size:12px;color:var(--mut)}.demo button{border:0;background:none;color:var(--mut);text-decoration:underline;text-underline-offset:3px;font-size:12.5px;padding:6px 2px;cursor:pointer}
.foot{text-align:center;font:500 13px var(--serif);color:var(--mut);margin:20px 0 0;letter-spacing:.18em;text-transform:uppercase}
.okc{width:64px;height:64px;border-radius:50%;border:1px solid #b8913e;color:#b8913e;display:grid;place-items:center;margin:2px auto 16px}
.hintpw{font-size:12.5px;color:var(--mut);margin:-6px 0 14px 2px}
.note{font-size:12.5px;color:var(--mut);text-align:center;margin:12px 0 4px}

 if(d.rmok){const c=S.coins.find(x=>x.id===d.rmok);busy(t,true);try{await rpc('cv2_salva',{p_sezione:'moneta_elimina',p:{voce:c.id}});S.cart.righe=S.cart.righe.filter(r=>r.id!==c.id);save();unmodal();await loadA();await loadD();go0('costi');toast(c.n+' eliminata')}catch(err){busy(t,false);unmodal();toast(err.message)}return}
 if(d.leave){unmodal();go0(d.leave);return}
 if(d.apply){const lab=t.textContent.trim().replace(/^Applica\s*/,'');const sec=t.closest('.grp')||t.closest('.blk');let ch=0;sec.querySelectorAll('[data-k]').forEach(el=>{const path=el.dataset.k.split('.');let o=S;for(let i=0;i<path.length-1;i++){if(o[path[i]]==null)o[path[i]]={};o=o[path[i]]}const v=nm(el.value);if(o[path.at(-1)]!==v){ch++;o[path.at(-1)]=v}el.value=fv(v)});

   const nb=[...document.querySelectorAll('[data-apply]')].find(b=>b.dataset.apply===d.apply),ns=nb&&(nb.closest('.grp')||nb.closest('.blk')).querySelector('.saved');if(ns){ns.hidden=false;ns.className='saved small ok';ns.textContent='✓ Salvato alle '+hhmm(Date.now())}
   toast(ch?'Salvato: '+lab:'Salvato (nessun valore cambiato)')}
  catch(err){busy(t,false);sv.className='saved small';sv.textContent='Non salvato: '+err.message;toast('Errore: '+err.message);try{await loadA()}catch(e){}}return}
 if(d.fmodo){fmodo=d.fmodo;go0(view);return}
 if(d.lt){lt=d.lt;lcash=lt==='999';go('lingotti');return}
 if(t.id==='mcash'){mcash=!mcash;t.classList.toggle('on',mcash);t.setAttribute('aria-pressed',mcash);upd();return}
 if(t.id==='lcash'){lcash=!lcash;t.classList.toggle('on',lcash);t.setAttribute('aria-pressed',lcash);upd();return}
 if(d.th!==undefined){if(d.th)document.documentElement.dataset.theme=d.th;else delete document.documentElement.dataset.theme;go('personale');return}
 if(t.id==='logout'||t.id==='logout2'){$('#app').classList.remove('menu');try{await sb.auth.signOut()}catch(e){}me.id='';me.n='';me.r='';A=null;D=null;S.prev=[];S.users=[];showLogin();return}
 if(d.lm){lmode=d.lm;drawLogin();return}
 if(d.eye){const i=$('#'+d.eye);i.type=i.type==='password'?'text':'password';t.style.color=i.type==='text'?'var(--gold)':'';return}
 if(t.id==='forgot'){const em=($('#le')&&$('#le').value.trim())||'';modal(`<div class="bh">Password dimenticata</div><div class="bb"><p style="margin-top:0">Scrivi la tua email: ti arriva un link per scegliere una nuova password.</p><label class="f"><span>Email</span><input id="fe" type="email" inputmode="email" autocapitalize="off" value="${esc(em)}"></label><div class="g2"><button class="btn out" id="mno">Annulla</button><button class="btn" id="fsend">Invia link</button></div></div>`);return}
 if(t.id==='fsend'){const em=$('#fe').value.trim().toLowerCase();if(!emailOk(em)){$('#fe').classList.add('err');return}busy(t,true);const{error}=await sb.auth.resetPasswordForEmail(em,{redirectTo:location.origin+location.pathname});unmodal();toast(error?'Invio non riuscito: '+error.message:'Se l\'email è registrata, ti arriva il link');return}
 if(t.id==='npsave'){const a=$('#np1').value,b=$('#np2').value;if(a.length<8){toast('Almeno 8 caratteri');return}if(a!==b){toast('Le due password non coincidono');return}busy(t,true);const{error}=await sb.auth.updateUser({password:a});if(error){busy(t,false);toast(error.message);return}unmodal();toast('Password aggiornata');history.replaceState(null,'',location.pathname);afterAuth();return}
 if(t.id==='doLogin'){const e=$('#le').value.trim().toLowerCase(),pw=$('#lp').value;if(!emailOk(e))return lerr('Scrivi un\'email valida.');if(!pw)return lerr('Scrivi la password.');
  busy(t,true);const{error}=await sb.auth.signInWithPassword({email:e,password:pw});busy(t,false);
  if(error){const m=error.message||'';return lerr(/invalid login/i.test(m)?'Email o password non corretti.':/not confirmed/i.test(m)?'Devi prima confermare l\'email: apri il link che ti è arrivato.':'Accesso non riuscito: '+m)}
  await afterAuth();return}
 if(t.id==='doReg'){const n=$('#rn').value.trim(),c=$('#rc').value.trim(),e=$('#re').value.trim().toLowerCase(),p1=$('#rp').value,p2=$('#rp2').value;
  if(!n||!c)return lerr('Scrivi nome e cognome.');if(!emailOk(e))return lerr('Scrivi un\'email valida.');
  if(p1.length<8)return lerr('La password deve avere almeno 8 caratteri.');if(p1!==p2)return lerr('Le due password non coincidono.');
  busy(t,true);const{data,error}=await sb.auth.signUp({email:e,password:p1,options:{data:{nome:n,cognome:c,ruolo_richiesto:'collaboratore'},emailRedirectTo:location.origin+location.pathname}});busy(t,false);
  if(error)return lerr(/already|registered/i.test(error.message)?'Esiste già un account con questa email.':'Registrazione non riuscita: '+error.message);
  if(data&&data.user&&Array.isArray(data.user.identities)&&!data.user.identities.length)return lerr('Esiste già un account con questa email.');
  if(data&&data.session)await sb.auth.signOut();lname=n;lmode='sent';drawLogin();return}
 if(d.us||d.auth||d.role){busy(t,true);try{if(d.us){const[i,s]=d.us.split(':');const u=S.users[+i];await rpc('gestisci_utente',{p_id:u.id,p_azione:s==='attivo'?'autorizza':s==='rifiutato'?'rifiuta':'revoca'});toast(u.n+': '+sLab[s].toLowerCase())}
  else if(d.auth){const u=S.users[+d.auth];await rpc('gestisci_utente',{p_id:u.id,p_azione:'autorizza'});await rpc('gestisci_utente',{p_id:u.id,p_azione:'promuovi'});toast('Accesso autorizzato: '+u.n+' (amministratore)')}
  else{const[i,r]=d.role.split(':');const u=S.users[+i];if(r==='amministratore')await rpc('gestisci_utente',{p_id:u.id,p_azione:'promuovi'});else await rpc('cv2_salva',{p_sezione:'declassa',p:{id:u.id}});toast(u.n+' ora è '+r)}
  await loadA();go0(view)}catch(err){busy(t,false);toast(err.message)}return}
});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.closest('#login')&&e.target.tagName==='INPUT'){e.preventDefault();($('#doLogin')||$('#doReg'))?.click();return}if(e.key==='Enter'&&e.target.matches('main input')){e.target.blur();return}if((e.key==='Enter'||e.key===' ')&&e.target.id==='vbig'){e.preventDefault();e.target.click()}});
$('#scrim').addEventListener('click',()=>$('#app').classList.remove('menu'));
$('#modal').addEventListener('click',e=>{if(e.target.id==='modal')unmodal()});
document.addEventListener('input',e=>{const t=e.target;t.classList.remove('err');if(t.dataset.k){const sec=t.closest('.grp')||t.closest('.blk'),b=sec.querySelector('[data-apply]'),sv=sec.querySelector('.saved');b.classList.add('dirty');sv.hidden=false;sv.className='saved small';sv.textContent='Modifiche non ancora salvate';return}
 if(t.id==='asrch'){aq=t.value;drawA();return}
 if(t.dataset.prop)lastP[t.dataset.g]=t.dataset.prop;
 if(t.id==='vg'||t.id==='vc'||t.dataset.val||t.dataset.prop||t.dataset.mq)upd()});

document.addEventListener('change',e=>{const t=e.target;if(t.id==='ncP'){readImg(t.files[0],u=>{pendingImg=u;toast('Foto pronta')});return}if(t.dataset.cimg){const c=S.coins.find(x=>x.id===t.dataset.cimg);readImg(t.files[0],async u=>{try{await rpc('cv2_salva',{p_sezione:'moneta_foto',p:{voce:c.id,foto:u}});await loadD();go0('costi');toast('Foto di '+c.n+' aggiornata')}catch(err){toast(err.message)}})}});
document.addEventListener('visibilitychange',()=>{if(document.hidden)hide()});

// ---------- tastiera su web mobile ----------
const vv=window.visualViewport;let focT=null;
if(vv){const onR=()=>{const kb=Math.max(0,window.innerHeight-vv.height-vv.offsetTop);document.documentElement.style.setProperty('--kb',kb+'px');$('#tab').classList.toggle('kbd',kb>120)};vv.addEventListener('resize',onR);vv.addEventListener('scroll',onR)}
document.addEventListener('focusin',e=>{if(!e.target.matches('main input'))return;if(e.target.type!=='search'&&e.target.value)setTimeout(()=>{try{e.target.select()}catch(_){}},0);clearTimeout(focT);const el=e.target;focT=setTimeout(()=>{if(document.activeElement===el)el.scrollIntoView({block:'center',behavior:'smooth'})},300)});

// ---------- processi automatici simulati ----------
let tick=0;setInterval(()=>{const now=Date.now();tick++;const qn=$('#qn');if(qn)qn.textContent=nextIn();
 if(me.id&&tick%60===0)refresh();
 if(view==='archivio'){let ch=false;S.prev.forEach(p=>{if(p.stato==='in_attesa'&&p.scad<now){p.stato='scaduto';ch=true}});if(ch)go0('archivio');document.querySelectorAll('[data-cd]').forEach(el=>{const p=S.prev.find(x=>x.n===+el.dataset.cd);if(p)el.textContent=cd(p.scad)})}},1000);
const payload=l=>{
 if(l==='riduzione acquisti')return[['riduzione',{oro:S.rid}]];
 if(l==='riduzione argento')return[['riduzione_argento',{argento:S.ridAg}]];
 if(l.startsWith('formule ')){const g=l.split(' · ')[1];return[['formule',{modalita:fmodo,voci:VOCI.filter(v=>v.g===g&&S.coef[fmodo]&&S.coef[fmodo][v.id]).map(v=>({voce:v.id,c:S.coef[fmodo][v.id][0],t:S.coef[fmodo][v.id][1]}))}]]}
 if(l==='vendita oreficeria'||l==='prezzo fedi'){const k=l==='prezzo fedi'?'fedi':'oreficeria';return[['vendita',{tipo:k,...S.vend[k]}]]}
 if(l==='vendita monete')return[['monete_vendita',{voci:S.coins.map(c=>({voce:c.id,ricarico:c.ric}))}]];
 if(l==='lingotti 750')return[['l750',S.ling.l750]];
 if(l==='lingotti 999'){const t=S.ling.l999.t;return[['l999',{iva:S.ling.l999.iva,mt:Object.fromEntries(T999.map(x=>[x,t[x][0]])),ut:Object.fromEntries(T999.map(x=>[x,t[x][1]]))}]]}
 if(l==='rivendita metalli'||l==='rivendita monete'){const mon=l==='rivendita monete';return[['rivendita',{voci:VOCI.filter(v=>(v.g==='mon')===mon&&S.riv[v.id]).map(v=>({voce:v.id,c:S.riv[v.id][0],t:S.riv[v.id][1]}))}]]}
 if(l==='semaforo')return[['semaforo',{oro:S.sem.oro,argento:S.sem.arg,sterline:S.sem.mon}]];
 return[]};

setTimeout(async()=>{$('#splash').style.display='none';if(/type=recovery/.test(location.hash))return;let s=null;try{s=(await sb.auth.getSession()).data.session}catch(e){}if(s)await afterAuth();else showLogin()},1200);
